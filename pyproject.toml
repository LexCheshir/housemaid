[project]
name = "housemaid"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lexcheshir", email = "simplgod@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "discord-py[voice]>=2.7.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[project.scripts]
housemaid = "housemaid.entrypoints.discord_client:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--verbose",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
